# Verified against @intellectronica/ruler 0.3.44 on 2026-07-15.
default_agents = ["claude", "codex"]
nested = false

[mcp]
enabled = false

# Generated guidance is intentionally committed so fresh clones and worktrees
# receive instructions before Ruler is installed.
[gitignore]
enabled = false
local = false

[backup]
enabled = false

# Phase 1 only distributes rules. Skills remain out of scope for now.
[skills]
enabled = false

[agents.claude]
enabled = true
output_path = "CLAUDE.md"

[agents.codex]
enabled = true
output_path = "AGENTS.md"
output_path_config = ".codex/config.toml"

[agents.gemini-cli]
enabled = false
output_path = "AGENTS.md"

[agents.cursor]
enabled = false
output_path = "AGENTS.md"

# Machine-local MCP paths are rendered separately by
# `python -m agent_hub.local_setup --apply`. Keeping them out of this tracked
# Ruler source prevents one developer's checkout path from becoming policy.
# Gemini and Cursor still read the shared AGENTS.md; local_setup owns their
# runtime config and Gemini's contextFileName.

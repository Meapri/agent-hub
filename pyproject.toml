[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub"
version = "3.0.3"
description = "Local-first durable multi-model agent runtime with an MCP bridge, isolated provider workers, policy-fenced egress, artifacts, and cross-harness handoff."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Park Chanwoo" }]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.12"]

# Console entry points — cwd-independent MCP/CLI launchers (available after `pip install -e .`).
[project.scripts]
agent-hub-mcp = "agent_hub.v2.bridge:serve"
agent-hubd = "agent_hub.v2.daemon:main"
agent-hub = "agent_hub.v2.cli:main"
agent-hub-connect = "agent_hub.connect_app:main"
claude-codex-consent = "claude_codex.consent_cli:main"
grok-codex-consent = "grok_codex.consent_cli:main"
google-antigravity-consent = "google_antigravity_codex.consent_cli:main"
openai-codex-consent = "openai_codex.consent_cli:main"

[tool.setuptools.package-data]
agent_hub = [
  "connect_ui/*.html",
  "connect_ui/*.css",
  "connect_ui/*.js",
  "v2/schemas/*.json",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "agent_hub*",
  "orchestrate_codex*",
  "claude_codex*",
  "grok_codex*",
  "google_antigravity_codex*",
  "openai_codex*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
# importlib mode: lets same-named test files (test_core.py) coexist across tests/<pkg>/ dirs.
addopts = "--import-mode=importlib --strict-markers"

[tool.ruff]
line-length = 100

# Pin the rule set explicitly. Leaving it implicit ties the lint contract to
# whichever ruff the dev extra resolves to, so a release that widens the
# defaults (0.16 did) turns CI red with no source change.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

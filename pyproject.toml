[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub"
version = "1.4.3"
description = "Unified personal multi-model coding hub: instruction consistency, cross-harness handoff, shared memory, and the orchestrate-codex conductor + provider leaf model-access stack in one project."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Park Chanwoo" }]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.12"]

# Console entry points — cwd-independent MCP/CLI launchers (available after `pip install -e .`).
[project.scripts]
agent-hub-mcp = "agent_hub.server:serve"
agent-hub-setup = "agent_hub.local_setup:main"
agent-hub-doctor = "agent_hub.doctor:main"
agent-hub-connect = "agent_hub.connect_app:main"
claude-codex-consent = "claude_codex.consent_cli:main"
grok-codex-consent = "grok_codex.consent_cli:main"
google-antigravity-consent = "google_antigravity_codex.consent_cli:main"
openai-codex-consent = "openai_codex.consent_cli:main"

[tool.setuptools.package-data]
agent_hub = ["connect_ui/*.html", "connect_ui/*.css", "connect_ui/*.js"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "agent_hub*",
  "orchestrate_codex*",
  "claude_codex*",
  "grok_codex*",
  "google_antigravity_codex*",
  "openai_codex*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
# importlib mode: lets same-named test files (test_core.py) coexist across tests/<pkg>/ dirs.
addopts = "--import-mode=importlib --strict-markers"

[tool.ruff]
line-length = 100
